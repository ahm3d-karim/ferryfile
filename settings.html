<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ferryfile Settings</title>
    <link rel="stylesheet" href="/src/fluent.css" />
    <link rel="stylesheet" href="/src/settings.css" />
  </head>
  <body>
    <main>
      <section>
        <h2>Drawer</h2>
        <div class="group">
          <div class="item">
            <span class="item-text"><span class="item-title" id="open-on-label">Opens when</span></span>
            <div class="seg" role="radiogroup" aria-labelledby="open-on-label" data-field="openOn">
              <label><input type="radio" name="openOn" value="hotkey" />You press a key</label>
              <label><input type="radio" name="openOn" value="drag" />Any drag</label>
            </div>
          </div>
          <div class="item sub" id="drag-hotkey-card">
            <span class="item-text">
              <span class="item-title">Key to press while dragging</span>
              <span class="item-desc">Only caught mid-drag. Otherwise it types as usual.</span>
            </span>
            <span class="hotkey-wrap">
              <button type="button" id="drag-hotkey-reset" class="link-btn">Reset</button>
              <button type="button" id="drag-hotkey" class="hotkey"></button>
            </span>
          </div>
          <div class="item sub" id="delay-card">
            <span class="item-text">
              <span class="item-title" id="delay-label">Wait before opening</span>
              <span class="item-desc">A short pause cuts down on accidental opens</span>
            </span>
            <div class="seg" role="radiogroup" aria-labelledby="delay-label" data-field="delay">
              <label><input type="radio" name="delay" value="0" />No</label>
              <label><input type="radio" name="delay" value="400" />Briefly</label>
            </div>
          </div>
          <div class="item">
            <span class="item-text">
              <span class="item-title">Show or hide any time</span>
              <span class="item-desc warn" id="hotkey-desc" hidden></span>
            </span>
            <span class="hotkey-wrap">
              <button type="button" id="hotkey-reset" class="link-btn">Reset</button>
              <button type="button" id="hotkey" class="hotkey"></button>
            </span>
          </div>
          <div class="item">
            <span class="item-text"><span class="item-title" id="side-label">Screen edge</span></span>
            <div class="seg" role="radiogroup" aria-labelledby="side-label" data-field="drawerSide">
              <label><input type="radio" name="drawerSide" value="left" />Left</label>
              <label><input type="radio" name="drawerSide" value="right" />Right</label>
            </div>
          </div>
        </div>
      </section>

      <section>
        <h2>Shelves</h2>
        <div class="group">
          <label class="item" for="shake">
            <span class="item-text">
              <span class="item-title">Shake to open a shelf</span>
              <span class="item-desc">Wiggle the cursor while dragging to park files</span>
            </span>
            <input id="shake" class="switch" type="checkbox" role="switch" />
          </label>
          <div class="item sub" id="sensitivity-card">
            <span class="item-text"><span class="item-title" id="sensitivity-label">How hard to shake</span></span>
            <div class="seg" role="radiogroup" aria-labelledby="sensitivity-label" data-field="shakeSensitivity">
              <label><input type="radio" name="shakeSensitivity" value="gentle" />Gentle</label>
              <label><input type="radio" name="shakeSensitivity" value="normal" />Normal</label>
              <label><input type="radio" name="shakeSensitivity" value="firm" />Firm</label>
            </div>
          </div>
        </div>
      </section>

      <section>
        <h2>Converted files</h2>
        <div class="group">
          <div class="item">
            <span class="item-text"><span class="item-title" id="output-label">Save to</span></span>
            <div class="seg" role="radiogroup" aria-labelledby="output-label" data-field="output">
              <label><input type="radio" name="output" value="next" />Same folder</label>
              <label><input type="radio" name="output" value="folder" />Another folder</label>
            </div>
          </div>
          <div class="item sub" id="folder-card" hidden>
            <button type="button" id="folder-path" class="path" title="Show in Explorer"></button>
            <button type="button" id="pick" class="btn small">Change…</button>
          </div>
          <div class="item">
            <label class="item-text" for="name-pattern">
              <span class="item-title">File names</span>
              <span class="item-desc">Use {name} {ext} {action} {date} {n}</span>
            </label>
            <span class="pattern-wrap">
              <button type="button" id="name-reset" class="link-btn">Reset</button>
              <input id="name-pattern" class="textbox pattern" type="text" spellcheck="false" autocomplete="off" maxlength="120" />
            </span>
          </div>
          <div class="item sub" id="name-preview-card">
            <span class="item-text" id="name-preview" aria-live="polite"></span>
          </div>
          <label class="item" for="replace-original">
            <span class="item-text">
              <span class="item-title">Replace the original</span>
              <span class="item-desc">Once the new file is saved and checked, the original goes to the Recycle Bin</span>
            </span>
            <input id="replace-original" class="switch" type="checkbox" role="switch" />
          </label>
        </div>
      </section>

      <section>
        <h2>System</h2>
        <div class="group">
          <label class="item" for="autostart">
            <span class="item-text">
              <span class="item-title">Start with Windows</span>
              <span class="item-desc">Waits in the tray so drags work right away</span>
            </span>
            <input id="autostart" class="switch" type="checkbox" role="switch" />
          </label>
        </div>
      </section>

      <p id="status" role="status"></p>
      <footer>
        <span id="about"></span>
        <span aria-hidden="true">·</span>
        <button type="button" id="config" class="link-btn">Settings folder</button>
      </footer>
    </main>
    <script type="module" src="/src/settings.js"></script>
  </body>
</html>
