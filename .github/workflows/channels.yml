name: Publish channels

# Runs when a GitHub release is published (not while it's a draft), so every
# channel points at public, final assets.
#
# - npm (ferryfile): set the repository variable PUBLISH_NPM=true. Uses npm
#   trusted publishing (OIDC, with provenance); for the very first publish,
#   add an NPM_TOKEN secret instead (see packaging/README.md).
# - winget (Ferryfile.Ferryfile): set PUBLISH_WINGET=true and a WINGET_TOKEN
#   secret (classic PAT with public_repo) once the package exists in
#   microsoft/winget-pkgs and you have a fork of it.
# - Scoop: nothing to do here; the bucket repo picks up new releases itself.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v0.1.0)
        required: true

permissions:
  contents: read

jobs:
  npm:
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5+.
      - run: npm install -g npm@latest

      - name: Describe the release for the launcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          zip="Ferryfile_${version}_x64-portable.zip"
          gh release download "$TAG" --pattern "$zip.sha256" --dir /tmp/release
          sha=$(cut -d' ' -f1 "/tmp/release/$zip.sha256")
          url="https://github.com/${{ github.repository }}/releases/download/$TAG/$zip"
          printf '{"version":"%s","url":"%s","sha256":"%s"}\n' "$version" "$url" "$sha" > packaging/npm/release.json
          cat packaging/npm/release.json
          cp LICENSE packaging/npm/LICENSE
          cd packaging/npm && npm version "$version" --no-git-tag-version

      - name: Publish to npm
        working-directory: packaging/npm
        env:
          # Only needed until trusted publishing is set up on npmjs.com.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

  winget:
    if: vars.PUBLISH_WINGET == 'true'
    runs-on: windows-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Ferryfile.Ferryfile
          installers-regex: '_x64-setup\.exe$'
          release-tag: ${{ github.event.release.tag_name || inputs.tag }}
          token: ${{ secrets.WINGET_TOKEN }}
