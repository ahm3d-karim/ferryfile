[package]
name = "ferryfile"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Drag-and-drop file converter for Windows"
repository = "https://github.com/ahm3d-karim/ferryfile"

[lib]
name = "ferryfile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma"] }
tauri-plugin-dialog = "2"
tauri-plugin-drag = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
pdfium-render = "0.9"
calamine = { version = "0.36", features = ["dates"] }
typst = "0.15"
typst-pdf = "0.15"
typst-layout = "0.15"
typst-kit = { version = "0.15", default-features = false, features = ["embedded-fonts", "scan-fonts", "system-files"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
tauri-plugin-global-shortcut = "2"
resvg = "0.47"
tar = "0.4"
flate2 = "1"
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["bzip2", "ppmd", "deflate", "util"] }
notify = { version = "8", default-features = false }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
clipboard-win = "5"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Registry",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_System_Console",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_System_SystemInformation",
]

[dev-dependencies]
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["compress", "util"] }
rust_xlsxwriter = "0.100"
