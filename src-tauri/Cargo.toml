[package]
name = "skiff"
version = "0.1.0"
edition = "2021"

[lib]
name = "skiff_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-drag = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
pdfium-render = "0.9"
calamine = { version = "0.36", features = ["dates"] }
typst = "0.15"
typst-pdf = "0.15"
typst-layout = "0.15"
typst-kit = { version = "0.15", default-features = false, features = ["embedded-fonts", "scan-fonts", "system-files"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
clipboard-win = "5"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
]

[dev-dependencies]
rust_xlsxwriter = "0.100"
