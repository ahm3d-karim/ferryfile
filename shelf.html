<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ferryfile Shelf</title>
    <link rel="stylesheet" href="/src/fluent.css" />
    <link rel="stylesheet" href="/src/shelf.css" />
  </head>
  <body>
    <main id="shelf">
      <header data-tauri-drag-region>
        <span class="title" data-tauri-drag-region>Shelf</span>
        <span id="count" class="count" data-tauri-drag-region></span>
        <button id="pin" class="icon-btn" data-icon="pin" title="Pin shelf" aria-label="Pin shelf"></button>
        <button id="close" class="icon-btn" data-icon="close" title="Close shelf (files stay where they are)" aria-label="Close shelf"></button>
      </header>

      <div id="empty" class="empty">
        <span data-icon="drop" data-icon-class="icon drop"></span>
        <p>Drop files here</p>
        <span class="sub">Drag them out again whenever you need them.</span>
      </div>
      <ul id="items"></ul>

      <section id="panel" hidden>
        <div id="groups"></div>
      </section>

      <div id="infobar" class="infobar" hidden>
        <span id="info-state" class="state"></span>
        <div class="msg">
          <span id="status"></span>
          <progress id="progress" max="1" value="0" hidden></progress>
        </div>
        <button id="info-cancel" type="button" class="btn small" hidden>Cancel</button>
      </div>

      <footer>
        <button id="drag-all" class="btn accent" data-icon="dragOut" title="Drag everything out at once" hidden>Drag all</button>
        <button id="actions" class="btn" title="Convert, zip, move or copy everything on this shelf" hidden>Actions</button>
      </footer>
    </main>
    <script type="module" src="/src/shelf.js"></script>
  </body>
</html>
