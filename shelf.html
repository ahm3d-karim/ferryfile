<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ferryfile Shelf</title>
    <link rel="stylesheet" href="/src/shelf.css" />
  </head>
  <body>
    <main id="shelf">
      <header data-tauri-drag-region>
        <span class="title" data-tauri-drag-region>Shelf</span>
        <span id="count" data-tauri-drag-region></span>
        <button id="pin" class="icon" title="Keep this shelf (pinned shelves stay open when emptied)">📌</button>
        <button id="close" class="icon" title="Close shelf (files stay where they are)">×</button>
      </header>

      <p id="empty">Drop files here.<br />Drag them out when you need them.</p>
      <ul id="items"></ul>

      <section id="panel" hidden>
        <div id="groups"></div>
      </section>

      <progress id="progress" max="1" value="0" hidden></progress>
      <p id="status"></p>

      <footer>
        <button id="drag-all" title="Drag everything out at once" hidden>⇲ Drag all</button>
        <button id="actions" title="Convert, zip, move or copy everything on this shelf" hidden>Actions ▾</button>
      </footer>
    </main>
    <script type="module" src="/src/shelf.js"></script>
  </body>
</html>
