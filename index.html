<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skiff</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="drawer" class="drawer">
      <header>
        <span class="boat">⛵</span>
        <h1>Skiff</h1>
        <button id="shelf-btn" class="shelf-btn" title="Show or hide the shelf">Shelf <span id="shelf-count"></span></button>
        <button id="close" class="close" aria-label="Close">×</button>
      </header>
      <section id="idle" class="hint">Drop a file here</section>
      <ul id="files"></ul>

      <div id="tools" hidden>
        <input id="search" type="search" placeholder="Search recipes and actions" autocomplete="off" />
        <section id="recipes">
          <h2>Recipes</h2>
          <div class="chips" id="recipe-chips"></div>
        </section>
        <div id="actions"></div>
      </div>

      <form id="editor" hidden>
        <h2 id="editor-title">New recipe</h2>
        <input id="recipe-name" type="text" placeholder="Recipe name" maxlength="60" autocomplete="off" />
        <ol id="steps"></ol>
        <select id="add-step"></select>
        <p id="editor-error" class="error"></p>
        <div class="editor-buttons">
          <button type="submit" id="save-recipe" class="primary">Save</button>
          <button type="button" id="cancel-recipe">Cancel</button>
          <button type="button" id="delete-recipe" class="danger" hidden>Delete</button>
        </div>
      </form>

      <progress id="progress" max="1" value="0" hidden></progress>
      <p id="status"></p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
